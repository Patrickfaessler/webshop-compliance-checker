# Local services (specs/07-architecture.md). The database itself runs on Supabase (ADR-5).
# Services are added with their milestones:
#   M1: testshop (WooCommerce)    later: api, worker, chromium, egress proxy
#
# Optional offline database: docker compose -f deploy/docker-compose.yml --profile localdb up -d
services:
  postgres:
    profiles: ["localdb"]
    image: postgres:16
    environment:
      POSTGRES_USER: checker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checker-dev-only}
      POSTGRES_DB: checker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
