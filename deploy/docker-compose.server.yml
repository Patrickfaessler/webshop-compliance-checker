# Full stack on one server behind Traefik with Let's Encrypt (specs/07-architecture.md, DEP-1).
#
#   1. DNS: point check, teehaus, radwerk and seifen.<DOMAIN> (or *.<DOMAIN>) at the server.
#   2. deploy/.env: DOMAIN=example.org and ACME_EMAIL=you@example.org (see deploy/.env.example).
#   3. docker compose -f deploy/docker-compose.server.yml up -d --build
#
# Result: https://check.<DOMAIN> (app, /api -> Go API) and https://{teehaus,radwerk,seifen}.<DOMAIN> (test shops).
name: webshop-check

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=webshop-check-web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [web]

  app:
    build: { context: .., dockerfile: frontend/Dockerfile }
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.wc-app.rule=Host(`check.${DOMAIN:?set DOMAIN in deploy/.env}`)
      - traefik.http.routers.wc-app.entrypoints=websecure
      - traefik.http.routers.wc-app.tls.certresolver=le
      - traefik.http.services.wc-app.loadbalancer.server.port=80
    networks: [web]

  api:
    build: { context: .., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    shm_size: 1gb # Chromium needs more than Docker's 64 MB /dev/shm
    security_opt: ["no-new-privileges:true"]
    environment:
      # Real client IP for rate limits comes from Traefik (C-RL-PROXY). Must match the network subnet below.
      TRUSTED_PROXIES: ${PROXY_SUBNET:-172.31.250.0/24}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-3}
      # Never set ALLOW_LOOPBACK_TARGETS here (C-SSRF-DEV is for local testing only).
    labels:
      - traefik.enable=true
      - traefik.http.routers.wc-api.rule=Host(`check.${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.wc-api.entrypoints=websecure
      - traefik.http.routers.wc-api.tls.certresolver=le
      - traefik.http.services.wc-api.loadbalancer.server.port=8080
    networks: [web]

  shops:
    build: { context: .., dockerfile: testshops/Dockerfile }
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.wc-shops.rule=Host(`teehaus.${DOMAIN}`) || Host(`radwerk.${DOMAIN}`) || Host(`seifen.${DOMAIN}`)
      - traefik.http.routers.wc-shops.entrypoints=websecure
      - traefik.http.routers.wc-shops.tls.certresolver=le
      - traefik.http.services.wc-shops.loadbalancer.server.port=80
    networks: [web]

networks:
  web:
    name: webshop-check-web
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.31.250.0/24}

volumes:
  letsencrypt:
