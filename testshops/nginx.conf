# teehaus.<domain> -> site/teehaus, radwerk.<domain> -> site/radwerk, seifen.<domain> -> site/seifen.
# Any other host gets 404. Missing pages are real 404s (the crawler must see them as errors).
map $host $shop {
    ~^(?<name>teehaus|radwerk|seifen)\. $name;
    default "";
}

server {
    listen 80 default_server;
    index index.html;
    root /usr/share/nginx/shops/$shop;
    add_header X-Robots-Tag "noindex, nofollow" always;

    if ($shop = "") {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
