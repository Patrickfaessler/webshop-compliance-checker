openapi: 3.0.3
info:
  title: Compliance Checker API (working title)
  version: 0.1.0-draft
  description: |
    Contract between the Flutter app and the Go API. No authentication: a scan is addressed by its
    unguessable id (ADR-1). Spec refs: F1, F7, F8, F10, F11, F12.
servers:
  - url: http://localhost:8080
paths:
  /api/scans:
    post:
      summary: Start a scan (F1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/scans/{id}:
    get:
      summary: Status, progress and score
      parameters: [ { $ref: '#/components/parameters/ScanId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/scans/{id}/findings:
    get:
      summary: Findings, filterable (F7)
      parameters:
        - { $ref: '#/components/parameters/ScanId' }
        - { name: severity, in: query, schema: { type: string, enum: [critical, warning, notice] } }
        - { name: rule, in: query, schema: { type: string, example: R6 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ruleResults:
                    type: array
                    items: { $ref: '#/components/schemas/RuleResult' }
                  findings:
                    type: array
                    items: { $ref: '#/components/schemas/Finding' }
  /api/scans/{id}/findings/{findingId}/crop.jpg:
    get:
      summary: Cropped screenshot around the finding's element (F8)
      description: Finding ids are unique only within a scan and there is no global store (ADR-6), so finding routes are scan-scoped. The finding detail itself is part of GET /api/scans/{id}/findings.
      parameters: [ { $ref: '#/components/parameters/ScanId' }, { name: findingId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { image/jpeg: {} } }
        '404': { description: unknown or expired scan, unknown finding, or no screenshot for this finding }
  /api/scans/{id}/findings/{findingId}/suggestion:
    post:
      summary: AI fix suggestion when no template fits (D-3). Not implemented yet (AI comes later).
      parameters: [ { $ref: '#/components/parameters/ScanId' }, { name: findingId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suggestion' }
  /api/scans/{id}/report.pdf:
    get:
      summary: Download the finished report as PDF (F10, ADR-6)
      description: Sent with `Content-Disposition: attachment`. Printed from the HTML report when a browser is available, else a text PDF (ADR-7). Only for scans with status done or incomplete.
      parameters: [ { $ref: '#/components/parameters/ScanId' } ]
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/scans/{id}/report.html:
    get:
      summary: Visual report as HTML (F14, specs/11-report.md)
      description: Shown inline; with `download=1` sent as attachment. Self-contained (images as data URIs, no script). Only for scans with status done or incomplete.
      parameters:
        - { $ref: '#/components/parameters/ScanId' }
        - { name: download, in: query, required: false, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: HTML report
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/scans/{id}/report.json:
    get:
      summary: Download the finished report as JSON (F13, ADR-6)
      description: Sent with `Content-Disposition: attachment`. Only for scans with status done or incomplete.
      parameters: [ { $ref: '#/components/parameters/ScanId' } ]
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    ScanId:
      name: id
      in: path
      required: true
      schema: { type: string, description: 'random 128-bit id, URL-safe' }
  responses:
    Problem:
      description: Error (RFC 9457 problem details; `title` is a German user message)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              retryAfterSeconds: { type: integer }
  schemas:
    ScanRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        areas:
          type: array
          items: { type: string, enum: [accessibility, legal] }
          default: [accessibility, legal]
        previousScanId: { type: string, description: 'F9 re-scan comparison' }
        keyboardAllPages: { type: boolean, default: false, description: 'A5 mode "alle Seiten" (10 min limit, C-1)' }
        keyboardMaxPresses: { type: integer, minimum: 50, maximum: 1000, default: 200, description: 'A5 Tab limit per page (A5-8)' }
    ScanStatus:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, done, incomplete, failed] }
        queuePosition: { type: integer }
        pagesDone: { type: integer }
        pagesTotal: { type: integer }
        score: { type: integer, minimum: 0, maximum: 100, nullable: true }
        expiresAt: { type: string, format: date-time }
        errorDe: { type: string, description: 'German reason when status = failed' }
        disclaimerDe: { type: string }
        keyboardAllPages: { type: boolean }
        keyboardMaxPresses: { type: integer }
        keyboardPagesProbed: { type: integer, description: 'pages that got a keyboard result (A5)' }
    RuleResult:
      type: object
      properties:
        ruleId: { type: string }
        state: { type: string, enum: [passed, failed, not_applicable, not_assessable] }
        decidedBy: { type: string, enum: [structural, dictionary, pattern, ai] }
        pagesAffected: { type: integer }
        noteDe: { type: string, description: 'German note on the result, e.g. A5 limit reached (A5-7)' }
        previousState: { type: string, nullable: true }
    Finding:
      type: object
      properties:
        id: { type: string }
        ruleId: { type: string }
        severity: { type: string, enum: [critical, warning, notice] }
        url: { type: string }
        summaryDe: { type: string }
        selector: { type: string }
        snippet: { type: string }
        sub: { type: string, nullable: true }
        explanationDe: { type: string }
        hasCrop: { type: boolean, description: 'true when GET …/findings/{findingId}/crop.jpg has an image' }
        fix: { $ref: '#/components/schemas/Suggestion' }
    FindingDetail:
      allOf:
        - $ref: '#/components/schemas/Finding'
        - type: object
          properties:
            explanationDe: { type: string }
            selector: { type: string }
            snippet: { type: string }
            evidenceQuote: { type: string, nullable: true }
            screenshotUrl: { type: string, nullable: true }
            legalBasis: { type: array, items: { type: string } }
    Report:
      type: object
      description: Downloadable report (F13). Consumers must check `format` and `version`.
      properties:
        format: { type: string, enum: [webshop-check-report] }
        version: { type: integer, enum: [1] }
        generatedAt: { type: string, format: date-time }
        disclaimerDe: { type: string }
        scan:
          type: object
          properties:
            id: { type: string }
            startUrl: { type: string }
            host: { type: string }
            areas: { type: array, items: { type: string } }
            status: { type: string, enum: [done, incomplete] }
            score: { type: integer, nullable: true }
            pagesScanned: { type: integer }
            createdAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time, nullable: true }
        ruleResults:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/RuleResult'
              - type: object
                properties:
                  nameDe: { type: string }
                  severity: { type: string, enum: [critical, warning, notice] }
        findings:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              ruleId: { type: string }
              severity: { type: string, enum: [critical, warning, notice] }
              url: { type: string }
              selector: { type: string }
              snippet: { type: string }
              sub: { type: string }
              summaryDe: { type: string }
              position: { type: string, enum: [element, page, hidden, outside, not_found], description: 'RP-3; absent if the page was not captured' }
              box:
                type: object
                nullable: true
                description: element box in CSS px of the page screenshot (RP-3), only for position element/outside/hidden
                properties: { x: { type: number }, y: { type: number }, width: { type: number }, height: { type: number } }
        pages:
          type: array
          description: captured pages (RP-1, RP-2); the screenshots themselves are only in the HTML/PDF report
          items:
            type: object
            properties:
              url: { type: string }
              width: { type: integer }
              height: { type: integer }
              viewportWidth: { type: integer }
              truncated: { type: boolean }
    Suggestion:
      type: object
      properties:
        origin: { type: string, enum: [template, ai] }
        textDe: { type: string }
        code: { type: string, nullable: true }
        noteDe: { type: string, nullable: true }
        reviewNoticeDe: { type: string, nullable: true, description: 'set when origin = ai' }
